<body>
  <canvas class="field" id="field" aria-hidden="true"></canvas>

  </noscript>
  <!-- Testi in chiaro per chi non ha JavaScript (e per i motori di ricerca): main.js li sostituisce -->
  <header class="hero" id="hero">
    <div class="hero__stage">
      <h1 class="hero__static-name">Marco Bresciani</h1>
      <p class="hero__tagline">Logistic Planner</p>
    </div>
  </header>
  <main class="bento" id="bento">
    <section class="tile tile--about">
      <h2 class="tile__title">Chi sono</h2>
      <p class="about__short">Logistic planner con una laurea in economia e marketing e la curiosità di chi vuole sempre capire come funzionano le cose. Dalla gestione dei trasporti alla strategia commerciale, fino all'intelligenza artificiale applicata al lavoro.</p>
    </section>
  </main>

  <dialog class="panel" id="panel" aria-labelledby="panelTitle">
    <div class="panel__head" id="panelHead">
      <h2 class="panel__title" id="panelTitle"></h2>
      <button class="panel__close" id="panelClose" type="button"><span aria-hidden="true">×</span></button>
    </div>
    <div class="panel__body" id="panelBody" tabindex="0" role="group" aria-labelledby="panelTitle"></div>
  </dialog>

  <script src="content.js"></script>
  <script src="apertura.js"></script>
  <script src="main.js"></script>
